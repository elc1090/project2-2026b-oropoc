<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mapa de Pontos de Coleta</title>
</head>
<body>
  <header>
    <h1>Mapa de Pontos de Coleta</h1>
    <button id="btn-novo-ponto">+ Novo Ponto</button>
  </header>

  <div id="map"></div>

  <div class="controles-mapa">
    <button id="btn-localizacao" class="controle-mapa" type="button">
      Minha localização
    </button>
    <button id="btn-historico" class="controle-mapa" type="button" aria-expanded="false">
      Histórico
    </button>
  </div>

  <aside id="painel-historico" class="painel-historico" aria-hidden="true">
    <div class="historico-cabecalho">
      <div>
        <h2>Pontos criados</h2>
        <p id="historico-contagem">0 pontos</p>
      </div>
      <button id="btn-fechar-historico" class="btn-fechar" type="button" aria-label="Fechar histórico">&times;</button>
    </div>
    <div id="lista-historico" class="lista-historico"></div>
  </aside>

  <div id="modal-form" class="modal escondido">
    <div class="modal-conteudo">
      <h2 id="form-titulo">Novo Ponto de Coleta</h2>
      <form id="form-ponto">
        <input type="hidden" id="ponto-id" />

        <label for="nome">Nome*</label>
        <input type="text" id="nome" required />

        <label for="tipo_material">Tipo de material</label>
        <input type="text" id="tipo_material" placeholder="ex: plástico, papel, eletrônico" />

        <label for="descricao">Descrição</label>
        <textarea id="descricao"></textarea>

        <label for="endereco">Endereço</label>
        <input type="text" id="endereco" />

        <p class="dica">Clique no mapa para definir a localização.</p>
        <p>Latitude: <span id="lat-display">-</span> | Longitude: <span id="lng-display">-</span></p>
        <input type="hidden" id="latitude" />
        <input type="hidden" id="longitude" />

        <div class="modal-botoes">
          <button type="submit">Salvar</button>
          <button type="button" id="btn-cancelar">Cancelar</button>
          <button type="button" id="btn-excluir" class="escondido">Excluir</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
